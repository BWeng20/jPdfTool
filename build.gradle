plugins {
    id 'java'
    id 'application'
    id 'edu.sc.seis.launch4j' version '4.0.0'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'org.asciidoctor.jvm.pdf' version '4.0.5'
}

group = 'io.github.bweng20'
version = '3.0'


repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.14.4'
    picocliVersion = '4.7.7'
    mustangVersion = '2.26.0'
    // Keep in sync with the version Mustang uses (see 'gradlew dependencies'), otherwise Gradle silently upgrades.
    pdfboxVersion = '3.0.8'
}

java {
    modularity.inferModulePath = true
}

// The code needs Java 17 (records, pattern matching). Fix the byte code level, independent of the JDK used to build.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    // The sources are UTF-8. Without this, javac before JDK 18 uses the platform encoding (cp1252 on Windows)
    // and texts like "Color…" are garbled.
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {

    implementation "com.formdev:flatlaf:3.7.2"
    implementation "com.formdev:flatlaf-fonts-roboto:2.137"
    implementation "io.github.bweng20:jSVGIcon:1.6"

    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'

    implementation "org.apache.pdfbox:pdfbox:${pdfboxVersion}"
    implementation "org.apache.pdfbox:fontbox:${pdfboxVersion}"
    // Version used by PDFBox, otherwise Gradle silently upgrades.
    implementation 'commons-logging:commons-logging:1.4.0'

    implementation "org.mustangproject:library:${mustangVersion}"
    implementation "org.mustangproject:validator:${mustangVersion}"
    implementation 'org.slf4j:slf4j-nop:2.0.20'
    // Seller presets (sellers.json). Version used by Mustang, otherwise Gradle silently upgrades.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'

    implementation("info.picocli:picocli:${picocliVersion}")
    annotationProcessor("info.picocli:picocli-codegen:${picocliVersion}")

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    // Gradle 8 brings an older launcher, which doesn't match the engine of JUnit 5.14.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.14.4"
}

// The version of this file is the only place with the version number: it is written into a Java class (BuildVersion)
// before compiling, together with the build date and the libraries the tool uses.
def versionSourceDir = layout.buildDirectory.dir('generated/sources/version/java')

tasks.register('generateVersion') {
    def outputDir = versionSourceDir
    def versionText = project.version.toString()
    def buildDate = java.time.LocalDate.now().toString()
    def runtime = configurations.runtimeClasspath
    inputs.property('version', versionText)
    inputs.property('buildDate', buildDate)
    inputs.files(runtime)
    outputs.dir(outputDir)
    doLast {
        // The libraries the project depends on directly, e.g. "org.apache.pdfbox:pdfbox:3.0.8".
        def libraries = runtime.resolvedConfiguration.firstLevelModuleDependencies
                .collect { "${it.moduleGroup}:${it.moduleName}:${it.moduleVersion}".toString() }
                .sort()
        def libraryLines = libraries.collect { '            "' + it + '"' }.join(',\n')
        def file = outputDir.get().file('com/bw/jPdfTool/BuildVersion.java').asFile
        file.parentFile.mkdirs()
        file.text = """package com.bw.jPdfTool;

/**
 * Version, build date and libraries of the tool, written by the Gradle task generateVersion. Do not edit.
 */
public final class BuildVersion {

    public static final String VERSION = "${versionText}";

    /**
     * Day of the build, "yyyy-MM-dd".
     */
    public static final String BUILD_DATE = "${buildDate}";

    /**
     * The direct dependencies as "group:name:version".
     */
    public static final String[] LIBRARIES = {
${libraryLines}
    };

    private BuildVersion() {
    }
}
"""
    }
}

sourceSets.main.java.srcDir(versionSourceDir)
tasks.named('compileJava') {
    dependsOn 'generateVersion'
}

// The license is shown in the About dialog.
processResources {
    from(layout.projectDirectory.file('LICENSE'))
}

test {
    useJUnitPlatform()
}

javadoc.options.addStringOption('Xdoclint:none', '-quiet')
javadoc.options.addStringOption('stylesheetfile', 'doc/javadoc.css')

application {
    mainClass = 'com.bw.jPdfTool.Main'
}

tasks.register('copyPngs', Copy) {
    from layout.projectDirectory.dir("doc")
    include("*.png")
    into layout.buildDirectory.dir("doc/doc")
}


tasks.register('copyDoc', Copy) {
    dependsOn(copyPngs)
    from layout.projectDirectory.file("README.adoc")
    into layout.buildDirectory.dir("doc")
}

pdfThemes {
    local 'basic', {
        themeDir = file('src/docs/themes')
        themeName = 'basic'
    }
}


asciidoctorPdf {
    dependsOn(copyDoc)
    // A changed theme or font creates the PDF again.
    inputs.dir('src/docs/themes')
    attributes 'pdf-themesdir': "${projectDir}/src/docs/themes",
            'pdf-theme': 'basic', // Matches 'custom-theme.yml'
            'pdf-fontsdir': "${projectDir}/src/docs/themes/fonts",
            'toc': 'macro',
            'toclevels': '2',
            'sectnums': '',
            'icons': 'font'

    asciidoctorj {
        options 'verbose': true
    }

    sourceDir  file('build/doc')
    sources {
        include 'README.adoc'
    }
    outputDir = file('build/doc/pdf')

}

// The README as PDF is the manual. It is not part of the jar but lies beside it (see Manual.java), in the
// distributions and when running with Gradle. asciidoctorPdf is only executed again if the README changed.
tasks.register('bundleManual', Copy) {
    dependsOn asciidoctorPdf
    from(layout.buildDirectory.dir('doc/pdf')) {
        include 'README.pdf'
        rename 'README.pdf', 'manual.pdf'
    }
    into layout.buildDirectory.dir('manual')
}

distributions.main.contents {
    from(tasks.named('bundleManual')) {
        into 'lib'
    }
}

tasks.named('run') {
    dependsOn 'bundleManual'
    systemProperty 'jpdftool.manual', layout.buildDirectory.file('manual/manual.pdf').get().asFile.absolutePath
}

tasks.register('cleanJreDir', Delete) {
    delete layout.buildDirectory.dir("jre").get()
}

tasks.register('jlink', Exec) {
    dependsOn cleanJreDir
    dependsOn build
    group = 'distribution'

    def imageDir = layout.buildDirectory.dir("jre").get()
    def modulePath = "${System.getProperty('java.home')}/jmods"

    commandLine 'jlink',
            '--module-path', modulePath,
            // jdeps result for the runtime classpath (Mustang needs XML, SQL and naming), plus logging for safety.
            '--add-modules', 'java.base,java.compiler,java.desktop,java.logging,java.management,java.naming,java.prefs,java.sql,java.xml,jdk.xml.dom',
            '--output', imageDir,
            '--strip-debug',
            '--compress', '2',
            '--no-header-files',
            '--no-man-pages'
}

launch4j {
    mainClassName = 'com.bw.jPdfTool.Main'
    outputDir = layout.buildDirectory.dir("launch4j").get().asFile.absolutePath
    outfile = "jPdfTool.exe"
    bundledJrePath = 'jre'
    // The bundled JRE is created by jlink from the JDK that runs the build, so it has no fixed version.
    // Only a lower limit: the byte code needs Java 17 (see options.release).
    jreMinVersion = '17'
    headerType = 'gui'
    requires64Bit = true
    copyConfigurable = configurations.runtimeClasspath
}

tasks.register('distZipWithJre', Zip) {
    group = "distribution"
    dependsOn(jlink)
    dependsOn(createExe)
    dependsOn(bundleManual)
    from('build/launch4j')
    from('build/jre') {
        into 'jre'
    }
    from('build/libs') {
        include '*.jar'
        into 'lib'
    }
    // The manual lies beside the jar.
    from(tasks.named('bundleManual')) {
        into 'lib'
    }
    archiveFileName = "jPdfTool-${project.version}-jre.zip"
    destinationDirectory = layout.buildDirectory.dir("distributions").get()
}