plugins {
    id 'java'
    id 'application'
    id 'edu.sc.seis.launch4j' version '4.0.0'
    id 'org.asciidoctor.jvm.convert' version '4.0.4'
    id 'org.asciidoctor.jvm.pdf' version '4.0.4'
}

group = 'io.github.bweng20'
version = '2.1'


repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.8.1'
    picocliVersion = '4.7.7'
    mustangVersion = '2.26.0'
    // Keep in sync with the version Mustang uses (see 'gradlew dependencies'), otherwise Gradle silently upgrades.
    pdfboxVersion = '3.0.8'
}

java {
    modularity.inferModulePath = true
}

// The code needs Java 17 (records, pattern matching). Fix the byte code level, independent of the JDK used to build.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    // The sources are UTF-8. Without this, javac before JDK 18 uses the platform encoding (cp1252 on Windows)
    // and texts like "Color…" are garbled.
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {

    implementation "com.formdev:flatlaf:3.6.1"
    implementation "com.formdev:flatlaf-fonts-roboto:2.137"
    implementation "io.github.bweng20:jSVGIcon:1.6"

    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'

    implementation "org.apache.pdfbox:pdfbox:${pdfboxVersion}"
    implementation "org.apache.pdfbox:fontbox:${pdfboxVersion}"
    // Version used by PDFBox, otherwise Gradle silently upgrades.
    implementation 'commons-logging:commons-logging:1.4.0'

    implementation "org.mustangproject:library:${mustangVersion}"
    implementation "org.mustangproject:validator:${mustangVersion}"
    implementation 'org.slf4j:slf4j-nop:2.0.17'
    // Seller presets (sellers.json). Version used by Mustang, otherwise Gradle silently upgrades.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'

    implementation("info.picocli:picocli:${picocliVersion}")
    annotationProcessor("info.picocli:picocli-codegen:${picocliVersion}")

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
}

test {
    useJUnitPlatform()
}

javadoc.options.addStringOption('Xdoclint:none', '-quiet')
javadoc.options.addStringOption('stylesheetfile', 'doc/javadoc.css')

application {
    mainClass = 'com.bw.jPdfTool.Main'
}

tasks.register('copyPngs', Copy) {
    from layout.projectDirectory.dir("doc")
    include("*.png")
    into layout.buildDirectory.dir("doc/doc")
}


tasks.register('copyDoc', Copy) {
    dependsOn(copyPngs)
    from layout.projectDirectory.file("README.adoc")
    into layout.buildDirectory.dir("doc")
}

pdfThemes {
    local 'basic', {
        themeDir = file('src/docs/themes')
        themeName = 'basic'
    }
}


asciidoctorPdf {
    dependsOn(copyDoc)
    attributes 'pdf-themesdir': "${projectDir}/src/docs/themes",
            'pdf-theme': 'basic', // Matches 'custom-theme.yml'
            'pdf-fontsdir': "${projectDir}/src/docs/themes/fonts"

    asciidoctorj {
        options 'verbose': true
    }

    sourceDir  file('build/doc')
    sources {
        include 'README.adoc'
    }
    outputDir = file('build/doc/pdf')

}

tasks.register('cleanJreDir', Delete) {
    delete layout.buildDirectory.dir("jre").get()
}

tasks.register('jlink', Exec) {
    dependsOn cleanJreDir
    dependsOn build
    group = 'distribution'

    def imageDir = layout.buildDirectory.dir("jre").get()
    def modulePath = "${System.getProperty('java.home')}/jmods"

    commandLine 'jlink',
            '--module-path', modulePath,
            // jdeps result for the runtime classpath (Mustang needs XML, SQL and naming), plus logging for safety.
            '--add-modules', 'java.base,java.compiler,java.desktop,java.logging,java.management,java.naming,java.prefs,java.sql,java.xml,jdk.xml.dom',
            '--output', imageDir,
            '--strip-debug',
            '--compress', '2',
            '--no-header-files',
            '--no-man-pages'
}

launch4j {
    mainClassName = 'com.bw.jPdfTool.Main'
    outputDir = layout.buildDirectory.dir("launch4j").get().asFile.absolutePath
    outfile = "jPdfTool.exe"
    bundledJrePath = 'jre'
    // The bundled JRE is created by jlink from the JDK that runs the build, so it has no fixed version.
    // Only a lower limit: the byte code needs Java 17 (see options.release).
    jreMinVersion = '17'
    headerType = 'gui'
    requires64Bit = true
    copyConfigurable = configurations.runtimeClasspath
}

tasks.register('distZipWithJre', Zip) {
    group = "distribution"
    dependsOn(jlink)
    dependsOn(createExe)
    dependsOn(asciidoctorPdf)
    from('build/launch4j')
    from('build/jre') {
        into 'jre'
    }
    from('build/libs') {
        include '*.jar'
        into 'lib'
    }
    from('build/doc/pdf') {
        include '*.pdf'
        into 'doc'
    }
    archiveFileName = "jPdfTool-${project.version}-jre.zip"
    destinationDirectory = layout.buildDirectory.dir("distributions").get()
}